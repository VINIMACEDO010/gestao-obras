# Ajuste organization e projectKey com os valores do SonarQube Cloud
sonar.organization=seu-usuario
sonar.projectKey=seu-usuario_gestao-obras
sonar.projectName=Gestão de Obras

sonar.sources=api/src,worker/src,web/src
sonar.tests=api/test,worker/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/seed-dev.ts
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info,worker/coverage/lcov.info
# O frontend é coberto pelos testes de ponta a ponta da API; fica fora da métrica de cobertura
sonar.coverage.exclusions=web/**,**/server.ts,**/index.ts,**/migrate.ts

# O pipeline falha se o quality gate não passar
sonar.qualitygate.wait=true
