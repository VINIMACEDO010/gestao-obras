# Deploy contínuo: roda depois que o CI passa na main.
# O ambiente "producao" exige aprovação manual (configure em Settings > Environments).
# Publica API (com o frontend embutido) e worker; a infraestrutura é aplicada pelo Terraform.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: producao
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TF_VAR_email_alertas: ${{ vars.EMAIL_ALERTAS }}
      TF_VAR_github_repositorio: ${{ github.repository }}
      ARQ_VARS: ${{ vars.LEARNER_LAB == 'true' && '-var-file=learner-lab.tfvars' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Credenciais AWS por OIDC (sem chaves guardadas)
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Learner Lab não permite OIDC: usa as credenciais temporárias da sessão do laboratório
      - name: Credenciais temporárias do Learner Lab
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: terraform init
        working-directory: infra/main
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=producao/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build das imagens
        run: |
          for app in api worker; do
            docker build -f $app/Dockerfile -t ${{ steps.ecr.outputs.registry }}/gestao-obras/$app:$SHA .
          done

      - name: Varredura das imagens (bloqueia HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.registry }}/gestao-obras/api:${{ env.SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.registry }}/gestao-obras/worker:${{ env.SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Publica as imagens
        run: |
          for app in api worker; do
            docker push ${{ steps.ecr.outputs.registry }}/gestao-obras/$app:$SHA
          done

      - name: terraform apply (infra + nova versão da API e do worker)
        working-directory: infra/main
        run: terraform apply -input=false -auto-approve $ARQ_VARS -var "imagem_tag=${SHA}"

      - name: Aguarda os serviços estabilizarem (migração roda no início de cada tarefa)
        run: aws ecs wait services-stable --cluster gestao-obras --services api worker

      - name: Endereço do sistema
        id: tf
        working-directory: infra/main
        run: echo "url_site=$(terraform output -raw url_site)" >> "$GITHUB_OUTPUT"

      - name: Teste de fumaça
        run: |
          URL=${{ steps.tf.outputs.url_site }}
          curl -fsS "$URL/api/health"
          # Sem token a API precisa responder 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/obras")" = "401"
          # Frontend respondendo
          curl -fsS "$URL/" | grep -q '<div id="root">'
